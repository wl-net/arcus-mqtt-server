# https://developers.home-assistant.io/docs/apps/configuration
name: Arcus MQTT
# The image tag Home Assistant pulls. The release workflow publishes it from tag v<version>
version: "0.2.4"
slug: arcus_mqtt
description: Arcus devices in Home Assistant, through the Mosquitto broker app
url: https://github.com/wl-net/arcus-mqtt-server
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Multi-arch manifest: the Supervisor pulls the image for its own architecture
image: ghcr.io/wl-net/arcus-mqtt-server
# The broker's address and login come from the Supervisor. The Supervisor doesn't
# enforce "need"; the server waits, logging why, until a broker app is installed
services:
  - mqtt:need
# No ports and no watchdog URL: the server only makes outgoing connections. The
# watchdog still restarts the app if it stops
# Keys are the server's environment variables; the server reads them from /data/options.json
options:
  ARCUS_BRIDGE_URL: null
schema:
  ARCUS_BRIDGE_URL: url
  ARCUS_API_KEY: password?
  ARCUS_USERNAME: str?
  ARCUS_PASSWORD: password?
  ARCUS_PLACE_ID: str?
  ARCUS_AUTH_TOKEN: password?
  # Optional features, comma-separated: buzz_in, lock_access, sirens (see the README)
  FEATURES: str?
