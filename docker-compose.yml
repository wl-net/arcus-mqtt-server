# Runs the server with its own Mosquitto broker, for Home Assistant Container installs (no apps).
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
# Home Assistant connects to the broker at localhost:1883 (see README).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # This machine only; the server reaches it over the compose network
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  arcus-mqtt:
    build: .
    env_file: .env
    depends_on: [mosquitto]
    restart: unless-stopped
    # The server only makes outgoing connections and writes no files
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # A second Arcus place, such as another building's hub (see README): copy .env to
  # .env.second, set the place and a different DEVICE_ID_PREFIX there, and uncomment
  # arcus-mqtt-second:
  #   build: .
  #   env_file: .env.second
  #   depends_on: [mosquitto]
  #   restart: unless-stopped
  #   user: node
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
