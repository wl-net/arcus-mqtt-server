name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:22-alpine runtime in the Dockerfile
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # A real MQTT 5 broker for the integration test in test/mqtt.test.ts
      - name: Start Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 -v "$PWD/test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - run: npm test
        env:
          TEST_MQTT_URL: mqtt://localhost:1883
