name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to hear about Home Assistant releases that break something
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:24-alpine runtime in the Dockerfile
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A real MQTT 5 broker for the integration test in test/mqtt.test.ts
      - name: Start Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 -v "$PWD/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - run: npm test
        env:
          TEST_MQTT_URL: mqtt://localhost:1883

  home-assistant:
    name: Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags too, to find the release to upgrade from
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ha
        env:
          # The pinned version on pushes; the latest stable release on the weekly run
          HA_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/home-assistant/home-assistant:stable' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: home-assistant-logs
          path: build-test/ha-logs/
