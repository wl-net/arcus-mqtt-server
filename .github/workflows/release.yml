name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wl-net/arcus-mqtt-server

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Home Assistant pulls the image tagged with the app's version, so the tag must match it
      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(yq '.version' arcus_mqtt/config.yaml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in arcus_mqtt/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A real MQTT 5 broker for the integration test in test/mqtt.test.ts
      - name: Start Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 -v "$PWD/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - run: npm test
        env:
          TEST_MQTT_URL: mqtt://localhost:1883

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One build per platform so each image gets the io.hass.* labels Home
      # Assistant expects, with its own arch name; then one multi-arch manifest
      - name: Build amd64 image
        id: amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: |
            io.hass.type=app
            io.hass.arch=amd64
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Build aarch64 image
        id: aarch64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          labels: |
            io.hass.type=app
            io.hass.arch=aarch64
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Push multi-arch manifest
        env:
          AMD64_DIGEST: ${{ steps.amd64.outputs.digest }}
          AARCH64_DIGEST: ${{ steps.aarch64.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$AARCH64_DIGEST"
